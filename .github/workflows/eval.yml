name: Harness Eval

on:
  # main is pushed to directly (no PR flow), so a pull_request-only trigger
  # meant this workflow never ran. Keep both, plus a manual handle.
  # NOTE: GitHub Actions does not support YAML anchors, so the path list is
  # duplicated below. Keep the two copies in sync.
  push:
    branches: [main]
    paths:
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'docs/**'
      # HANDOFF is rewritten every session; it carries no harness contract.
      - '!docs/HANDOFF.md'
      - 'eval/**'
      - 'prompts/**'
      - 'scripts/**'
      - 'content/blog/**'
      - 'data/overrides.json'
      - 'package.json'
  pull_request:
    paths:
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'docs/**'
      - '!docs/HANDOFF.md'
      - 'eval/**'
      - 'prompts/**'
      - 'scripts/**'
      - 'content/blog/**'
      - 'data/overrides.json'
      - 'package.json'
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Eval Pipeline
        run: bash eval/eval-runner.sh

      - name: Check for Regressions
        run: bash eval/check-regression.sh --threshold 5.0

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_number }}
          path: eval/results/
