name: Health Check

on:
  schedule:
    # Hourly. 주 1회로는 추세를 볼 수 없다 — 한 점만 찍히고 그 사이에 무슨 일이
    # 있었는지 알 방법이 없다. GitHub schedule cron은 부하 시 밀리므로 정시를
    # 보장하지 않는다(그래서 지표에 실행 시각을 같이 싣는다).
    - cron: '0 * * * *'
    # 23:50 KST — 그날 마지막 관측을 일별 요약에 접어 넣고 커밋한다.
    - cron: '50 14 * * *'
  workflow_dispatch: # manual trigger

permissions:
  contents: write # 일별 요약 커밋
  issues: write # 장애 시 이슈 생성

jobs:
  healthcheck:
    runs-on: ubuntu-latest

    defaults:
      run:
        # 2026-08-12: `node ... | tee`가 node의 종료 코드를 tee의 0으로 덮어써서
        # 6주 동안 실패한 크롤이 "success"로 기록됐다. pipefail이 없으면
        # 파이프로 로그를 남기는 순간 그 단계는 절대 실패하지 않는다.
        shell: bash -euo pipefail {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run health check
        id: healthcheck
        env:
          # 시크릿이 없으면 스크립트가 경고만 남기고 넘어간다 (실패시키지 않는다).
          INSTAGRAM_LONG_LIVED_TOKEN: ${{ secrets.INSTAGRAM_LONG_LIVED_TOKEN }}
          INSTAGRAM_PAGE_TOKEN: ${{ secrets.INSTAGRAM_PAGE_TOKEN }}
          INSTAGRAM_IG_ACCOUNT_ID: ${{ secrets.INSTAGRAM_IG_ACCOUNT_ID }}
        run: |
          # --quick을 뺐다. 그게 붙어 있는 동안 SSL·인스타·데이터 정합 점검은
          # CI에서 한 번도 실행된 적이 없다.
          node scripts/healthcheck.mjs 2>&1 | tee /tmp/healthcheck.txt
        continue-on-error: true

      - name: Full site crawl
        id: crawl
        run: |
          node --input-type=module -e "
          import { readFile } from 'node:fs/promises';
          const places = JSON.parse(await readFile('./data/places.json', 'utf8'));
          let ok = 0, fail = 0;
          for (const p of places) {
            const res = await fetch('https://noglutenkorea.com/place/' + p.slug);
            if (res.ok) ok++; else { fail++; console.log('FAIL: ' + p.slug + ' HTTP ' + res.status); }
          }
          console.log('Pages: ' + ok + ' OK, ' + fail + ' failed out of ' + places.length);
          if (fail > 0) process.exit(1);
          " 2>&1 | tee /tmp/crawl.txt
        continue-on-error: true

      - name: Create issue on failure
        if: steps.healthcheck.outcome == 'failure' || steps.crawl.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // 시간당 실행이므로 장애가 이어지면 하루 24건이 열린다.
            // 이미 열린 알림이 있으면 새로 만들지 않고 댓글로 이어 붙인다.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'monitoring',
              per_page: 1,
            });

            const read = (p) => fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : 'N/A';
            const sections = [];
            if ('${{ steps.healthcheck.outcome }}' === 'failure') sections.push('## Health Check\n```\n' + read('/tmp/healthcheck.txt') + '\n```');
            if ('${{ steps.crawl.outcome }}' === 'failure') sections.push('## Page Crawl\n```\n' + read('/tmp/crawl.txt') + '\n```');
            const body = sections.join('\n\n') + `\n\n---\n[run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) · *auto-generated*`;

            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Still failing at ${new Date().toISOString()}\n\n` + body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔴 Health Check Failed — ${new Date().toISOString().slice(0,10)}`,
                body,
                labels: ['monitoring'],
              });
            }

      - name: Fold into daily summary
        # 하루 1회만 커밋한다. 매시간 커밋하면 저장소가 로그로 뒤덮이고
        # deploy.yml(push to main)이 매시간 배포를 돌린다.
        if: github.event.schedule == '50 14 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          node scripts/daily-summary.mjs

          if git diff --quiet -- data/daily-summary.csv; then
            echo "No change in daily summary."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-summary.csv
          # [skip ci] — 이 커밋으로 배포가 돌지 않게 한다.
          git commit -m "chore(monitoring): daily health summary [skip ci]"
          git push

      - name: Summary
        if: always()
        run: |
          echo "## Health Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| HTTP · SSL · Instagram · Data | ${{ steps.healthcheck.outcome == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Full page crawl | ${{ steps.crawl.outcome == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
